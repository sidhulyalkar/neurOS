# workflows/sample_workflow.yaml
# Device and processing graph specification for mock EEG → bandpass
device_key: mock
device_params:
  sample_rate: 10.0
  channels:
    - Cz
nodes:
  - name: bp_filter
    processor: core.signals.bandpass_filter.BandpassFilter
    params:
      low: 1.0
      high: 40.0
      fs: 10.0
edges: []