# enterprise/cloud/kubernetes/pod-security-policy.yaml
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: neuros-psp
  namespace: neuros-enterprise
  labels:
    app.kubernetes.io/name: neuros
    app.kubernetes.io/component: security
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  supplementalGroups:
    rule: 'MustRunAs'
    range:
      min: 1
      max: 65535
  fsGroup:
    rule: 'MustRunAs'
    range:
      min: 1
      max: 65535
  seccompProfile:
    type: 'RuntimeDefault'