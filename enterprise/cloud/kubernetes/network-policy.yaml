# enterprise/cloud/kubernetes/network-policy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: neuros-network-policy
  namespace: neuros-enterprise
  labels:
    app.kubernetes.io/name: neuros
    app.kubernetes.io/component: security
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from API Gateway to Processing Engine
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: api-gateway
    to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: processing-engine
    ports:
    - protocol: TCP
      port: 8000
  # Allow ingress from Processing Engine to Database
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: processing-engine
    to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: database
    ports:
    - protocol: TCP
      port: 5432
  # Allow monitoring ingress
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow egress to DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow egress to external APIs (OpenAI, etc.)
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
